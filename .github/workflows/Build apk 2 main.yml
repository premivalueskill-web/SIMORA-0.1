
name: SIMORA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "simora-android/**"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      
      
      
      
      - name: Build APK - Debug
        working-directory: simora-android
        run: |
          echo "STEP 1: Shell check"
          command -v bash || true
          command -v sh || true
          echo "STEP 2: File check"
          ls -l gradlew
          echo "STEP 3: Run Gradle wrapper"
          sh ./gradlew --version

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMORA-APK
          path: simora-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
